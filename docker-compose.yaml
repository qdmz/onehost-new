services:
  mysql:
    image: mysql:8.0
    container_name: onehost-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-onehost_root}
      MYSQL_DATABASE: onehost
      MYSQL_USER: onehost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-onehost_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-onehost_root}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [onehost]

  api:
    build: ./api
    container_name: onehost-api
    restart: unless-stopped
    environment:
      ONEHOST_DB_HOST: mysql
      ONEHOST_DB_PORT: "3306"
      ONEHOST_DB_NAME: onehost
      ONEHOST_DB_USER: onehost
      ONEHOST_DB_PASSWORD: ${MYSQL_PASSWORD:-onehost_pass}
      ONEHOST_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ONEHOST_PORT: "8888"
      ONEHOST_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [onehost]

  web:
    build: ./web
    container_name: onehost-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on: [api]
    networks: [onehost]

volumes:
  mysql_data:

networks:
  onehost:
